name: 🔑 Dar Acceso al Portal (Vista360 Player)

on:
  workflow_dispatch:
    inputs:
      cliente_id:
        description: 'ID del cliente en Vista360 (o "admin" para darte acceso admin a ti)'
        required: true
      email:
        description: "Correo de la persona que va a entrar al portal"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dar-acceso:
    name: Crear cuenta y enviar correo de acceso
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          cd scripts
          npm init -y
          npm install firebase-admin firebase

      - name: Crear acceso y enviar correo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          CLIENTE_ID_INPUT: ${{ github.event.inputs.cliente_id }}
          EMAIL_INPUT: ${{ github.event.inputs.email }}
        run: node scripts/crear-acceso-cliente.mjs
