name: 🟢 Liberar Paneles con Contratos Vencidos

on:
  schedule:
    - cron: "0 11 * * *"   # Todos los días a las 11:00 UTC (6am Perú)
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  liberar:
    name: Revisar y liberar paneles sin contratos vigentes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          cd scripts
          npm init -y
          npm install firebase-admin

      - name: Liberar paneles vencidos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/liberar-paneles-vencidos.mjs
