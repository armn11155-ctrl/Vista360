name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vista360.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Solo corre si CLOUDFLARE_API_TOKEN está configurado.
      # Sin él, Cloudflare Pages Git integration maneja el deploy automáticamente.
      - name: Deploy via Wrangler
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vista360 --branch=main

      - name: Notice — deploy via Cloudflare Git integration
        if: env.CF_API_TOKEN == ''
        run: |
          echo "ℹ️  CLOUDFLARE_API_TOKEN no configurado."
          echo "   El deploy lo gestiona Cloudflare Pages Git integration."
          echo "   Para habilitar deploy explícito via Wrangler, agrega los secrets:"
          echo "     CLOUDFLARE_API_TOKEN  →  https://dash.cloudflare.com/profile/api-tokens"
          echo "     CLOUDFLARE_ACCOUNT_ID →  https://dash.cloudflare.com (sidebar derecho)"

      # Polling con reintentos (fix: reemplaza sleep 45 hardcodeado)
      # Intenta hasta 10 veces con 15s de espera entre intentos (máx 2.5 min)
      - name: Smoke test con reintentos
        run: |
          MAX=10
          WAIT=15
          URL="https://vista360.pages.dev"
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Intento $i/$MAX — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Smoke test OK"
              exit 0
            fi
            if [ $i -lt $MAX ]; then
              echo "   Esperando ${WAIT}s..."
              sleep $WAIT
            fi
          done
          echo "::error::Smoke test falló después de $MAX intentos — último status: $STATUS"
          exit 1
