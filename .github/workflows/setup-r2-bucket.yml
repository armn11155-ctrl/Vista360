name: 🪣 Configurar R2 — Crear Bucket

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crear-bucket:
    name: Crear bucket de almacenamiento en R2
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "01230a54a4e3325f71c354e3c58639d0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Crear bucket vista360-evidencias
        id: crear
        run: |
          set +e
          npx wrangler r2 bucket create vista360-evidencias > /tmp/wrangler-out.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/wrangler-out.txt

      - name: Guardar resultado en el repo (para diagnóstico)
        if: always()
        run: |
          mkdir -p .debug
          cp /tmp/wrangler-out.txt .debug/wrangler-out.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .debug/wrangler-out.txt
          git commit -m "debug: resultado de wrangler r2 bucket create" || echo "sin cambios"
          git push origin HEAD:debug-r2-output --force

      - name: Confirmar que existe
        run: npx wrangler r2 bucket list
