name: 🪣 Configurar R2 — Crear Bucket

on:
  workflow_dispatch: {}

jobs:
  crear-bucket:
    name: Crear bucket de almacenamiento en R2
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "01230a54a4e3325f71c354e3c58639d0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crear bucket vista360-evidencias
        run: |
          set +e
          OUTPUT=$(npx wrangler r2 bucket create vista360-evidencias 2>&1)
          echo "$OUTPUT"
          if [ $? -ne 0 ]; then
            SAFE=$(echo "$OUTPUT" | tr '\n' ' ' | tr '%' ' ')
            echo "::error::WRANGLER_FAIL: $SAFE"
            exit 1
          fi

      - name: Confirmar que existe
        run: npx wrangler r2 bucket list
