name: 📊 Reporte Mensual — Vista360

on:
  schedule:
    - cron: "30 22 * * 6"   # Cada sábado a las 22:30 UTC (5:30pm Perú) — el script se salta solo si no es el primer sábado del mes
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a reportar (1-12). Vacío = mes anterior."
        required: false
      anio:
        description: "Año (ej: 2026). Vacío = año actual."
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reporte:
    name: Generar PDF y enviar por email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          cd scripts
          npm init -y
          npm install firebase-admin nodemailer puppeteer

      - name: Generar PDF y enviar reporte
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          MES_INPUT: ${{ github.event.inputs.mes }}
          ANIO_INPUT: ${{ github.event.inputs.anio }}
          ES_DISPARO_PROGRAMADO: ${{ github.event_name == 'schedule' }}
        run: node scripts/reporte-mensual-vista360.mjs
