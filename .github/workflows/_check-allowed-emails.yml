name: 🔍 Chequeo único — config/allowedEmails

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd scripts
          npm init -y
          npm install firebase-admin
      - name: Chequear
        run: |
          set +e
          node scripts/_check-allowed-emails.mjs > /tmp/out.txt 2>&1
          cat /tmp/out.txt
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Guardar resultado
        if: always()
        run: |
          mkdir -p .debug
          cp /tmp/out.txt .debug/check-allowed-emails-out.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .debug/check-allowed-emails-out.txt
          git commit -m "debug: check allowedEmails" || echo "sin cambios"
          git push origin HEAD:debug-check-allowed-emails --force
