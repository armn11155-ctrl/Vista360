name: 📬 Informes Mensuales — Clientes (Vista360-Player)

on:
  schedule:
    - cron: "0 14 1 * *"   # Cada día 1 del mes a las 14:00 UTC (1h después del reporte interno)
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a reportar (1-12). Vacío = mes anterior."
        required: false
      anio:
        description: "Año (ej: 2026). Vacío = año actual."
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  informes:
    name: Generar PDFs por cliente y notificar por correo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          cd scripts
          npm init -y
          npm install firebase-admin nodemailer puppeteer

      - name: Generar informes y enviar correos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          MES_INPUT: ${{ github.event.inputs.mes }}
          ANIO_INPUT: ${{ github.event.inputs.anio }}
        run: node scripts/informe-mensual-clientes.mjs
