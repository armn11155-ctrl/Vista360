name: 🎂 Felicitar Cumpleaños de Clientes

on:
  schedule:
    - cron: "0 13 * * *"   # Todos los días a las 13:00 UTC (8am Perú)
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  felicitar:
    name: Revisar cumpleaños y enviar felicitación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          cd scripts
          npm init -y
          npm install firebase-admin nodemailer

      - name: Enviar felicitaciones
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: node scripts/felicitar-cumpleanos.mjs
