version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      patch-minor:
        update-types:
          - "patch"
          - "minor"
      major-upgrades:
        update-types:
          - "major"
    ignore:
      []

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-all:
        patterns:
          - "*"
