<!DOCTYPE html>
<html lang="es" style="background:#0E1A3B">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SPLASH: status bar y fondo oscuro desde el primer frame,
      antes de que React monte. El JS (useHeaderShell) tomará
      el control del theme-color en cuanto el usuario navegue.
    -->
    <meta name="theme-color" content="#0E1A3B" />
    <style>
      html, body, #root { background: #000000 !important; min-height: 100dvh; }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      black-translucent: barra translucida con iconos blancos.
      Permite que theme-color controle el color real de la barra
      tanto en el splash oscuro como en los headers de color.
      El AppHeader ya usa env(safe-area-inset-top) para el padding.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vista360" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Vista360</title>
  </head>
  <body style="background:#000;margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
